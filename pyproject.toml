[project]
name = "intelligence"
version = "0.1.0"
description = "Intelligence: ML + LLM ranking and recommendations over Funnels and Conversations analytics APIs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "cryptography>=43",
  "pyjwt>=2.9",
  "prometheus-client>=0.20",
  "anthropic>=0.40",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.3"]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "jsonschema>=4.22",
  "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: long-running benchmark tests (run with -m slow)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["app/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101", "RUF012", "B008", "S311", "S608", "E501", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["app/db/migrations/"]
